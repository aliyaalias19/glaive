[project]
name = "glaive"
version = "0.2.1"
readme = "README.md"
description = "AI forensic investigator whose every finding is verified against the evidence. Works with any model (Claude, GPT, DeepSeek, Qwen, Kimi, GLM, local) or none."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aliya Alias" }]

dependencies = [
    # MCP server (the verification layer)
    "mcp>=1.2.0,<3",
    # Graph + typing
    "networkx>=3.2",
    "pydantic>=2.7",
    # Forensic primitives (Python-native; SIFT also provides binaries)
    "volatility3>=2.7.0",
    "python-evtx>=0.8.0",
    "lxml>=5.0",
    "regipy>=4.0.0",
    "pytsk3>=20231007",
    # Interface + reporting
    "rich>=13.7.0",
    "typer>=0.12.0",
    # Utilities
    "pyyaml>=6.0",
    "orjson>=3.10.0",
    # AI model access (all providers speak HTTP; no vendor SDKs needed)
    "httpx>=0.27",
    # Web app
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# ~1000x faster EVTX parsing (Rust). Linux only: on Windows and macOS its
# package folder "evtx" collides with python-evtx's "Evtx" (case-insensitive
# file systems), which breaks both. GLAIVE falls back to python-evtx.
fast = ["evtx>=0.8; sys_platform == 'linux'"]
# Send the audit trail to an OpenTelemetry backend (Jaeger, Tempo, Langfuse...).
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
dev = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
glaive = "glaive.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glaive*"]

[tool.setuptools.package-data]
"glaive.detection" = ["rules/*.yml", "attack.json"]
"glaive.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
# Long string literals (paths, command lines, test fixtures) are clearer unwrapped.
# UP017/UP035/UP037: the codebase consistently uses timezone.utc, typing
# imports and quoted annotations; keep that style rather than churn files.
ignore = ["E501", "UP017", "UP035", "UP037"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/Argument() and FastAPI File() in defaults are documented APIs.
"glaive/cli.py" = ["B008"]
"glaive/web/app.py" = ["B008"]
"glaive/ingestion/volatility.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "verification"]
markers = [
    "integration: tests that hit real evidence files (slow). Run with: pytest -m integration",
    "bypass: adversarial tests against the gate / MCP boundary. Run with: pytest -m bypass",
]
addopts = "-m 'not integration and not bypass'"
