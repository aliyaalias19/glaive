title: PowerShell Script Block With Credential Theft Keywords
id: 3937780a-c389-5386-9d56-7c45be4a058c
status: experimental
description: A PowerShell script block contains keywords used by credential-dumping tools.
author: GLAIVE project
date: 2026/10/02
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains:
      - 'Invoke-Mimikatz'
      - 'sekurlsa::'
      - 'MiniDumpWriteDump'
      - 'lsadump::'
      - 'Get-GPPPassword'
  condition: selection
falsepositives:
  - Authorised red-team exercises
level: critical
