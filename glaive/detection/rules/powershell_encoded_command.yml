title: PowerShell Encoded Command Line
id: 24d802e0-3261-5c99-82ab-68404cad4a86
status: experimental
description: PowerShell was started with a base64-encoded command, a common way to hide what a script does.
author: GLAIVE project
date: 2026/10/02
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_cli:
    CommandLine|windash|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
      - ' -e JAB'
      - ' -e SQB'
      - ' -e aQB'
  condition: all of selection_*
falsepositives:
  - Some management agents use encoded commands
level: high
