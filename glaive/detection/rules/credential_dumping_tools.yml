title: Credential Dumping Tool Command Line
id: 868c4106-ebaf-5ec3-8408-5558aa34e264
status: experimental
description: Command line contains arguments used by credential-dumping tools such as Mimikatz or a LSASS memory dump.
author: GLAIVE project
date: 2026/10/02
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_mimikatz:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'privilege::debug'
      - 'kerberos::'
  selection_comsvcs:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  selection_procdump:
    CommandLine|contains|all:
      - 'procdump'
      - 'lsass'
  condition: 1 of selection_*
falsepositives:
  - Authorised red-team exercises
level: critical
