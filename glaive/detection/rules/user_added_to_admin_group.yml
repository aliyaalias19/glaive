title: User Added to a Privileged Group
id: 4f381864-d0c1-5800-90fe-84fcf525d4ec
status: experimental
description: An account was added to the local Administrators group or a privileged domain group.
author: GLAIVE project
date: 2026/10/02
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 4728
      - 4732
      - 4756
  selection_group:
    - TargetSid: 'S-1-5-32-544'
    - TargetSid|endswith:
        - '-512'
        - '-518'
        - '-519'
    - TargetUserName|contains:
        - 'Admin'
  condition: all of selection_*
falsepositives:
  - Planned administrator changes
level: high
